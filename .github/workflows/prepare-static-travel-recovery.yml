name: Prepare static travel recovery

on:
  push:
    paths:
      - .github/workflows/prepare-static-travel-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch travel entry page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('travel-ui-v2/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="/style.css"','href="./style.css"')
          s=s.replace('<script src="/app.js"></script>','<script src="./local-api-shim.js"></script>\n<script src="./bootstrap-local.js"></script>')
          s=s.replace('<script src="/seed-fukuoka.js"></script>','')
          s=s.replace('查看所有裝置共用的旅行資料。','查看已保存的福岡旅行資料。')
          s=s.replace('登入並同步','登入旅程')
          s=s.replace('資料會先加密，再儲存到共用雲端。','資料會先加密，再保存在目前裝置。')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "Travel Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add travel-ui-v2/index.html
          git diff --cached --quiet || git commit -m "Prepare static Fukuoka travel recovery"
          git push
